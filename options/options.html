<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SurveyPilot AI — Settings</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body data-theme="light">
  <div class="opts-wrap">
    <header class="opts-head">
      <div class="brand">
        <div class="brand-logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h3l3-8 4 16 3-8h5" /></svg></div>
        <div>
          <div class="brand-title">SurveyPilot AI — Settings</div>
          <div class="brand-sub">Minimal configuration</div>
        </div>
      </div>
    </header>

    <main class="opts-body">
      <section class="card">
        <h2>AI Configuration</h2>
        <div class="form-row">
          <label>Gemini API key <span class="muted small">(optional)</span></label>
          <div class="key-row">
            <input type="password" id="apiKey" placeholder="Leave empty for offline mode" autocomplete="off" />
            <button id="toggleKeyVisibility" class="btn ghost sm">Show</button>
          </div>
          <p class="muted small">Get a free key at aistudio.google.com/app/apikey</p>
        </div>
        <div class="form-row">
          <label>Mode</label>
          <select id="generationMode">
            <option value="auto">Automatic (AI when available, else local)</option>
            <option value="ai">AI only (Gemini)</option>
            <option value="local">Local only (offline)</option>
          </select>
        </div>
        <div class="form-row">
          <label>AI model</label>
          <select id="aiModel">
            <option value="gemini-2.0-flash">Gemini 2.0 Flash (stable, recommended)</option>
            <option value="gemini-2.0-flash-lite">Gemini 2.0 Flash Lite (fastest)</option>
            <option value="gemini-2.5-flash">Gemini 2.5 Flash (preview)</option>
            <option value="gemini-2.5-pro">Gemini 2.5 Pro (preview, highest quality)</option>
          </select>
        </div>
        <div class="form-row">
          <label>&nbsp;</label>
          <button id="testApiKey" class="btn">Test API key</button>
          <span id="apiTestResult" class="muted small"></span>
        </div>
      </section>

      <section class="card">
        <h2>Preferences</h2>
        <div class="form-row">
          <label>Default respondent count</label>
          <input type="number" id="defaultCount" min="1" max="500" value="5" />
        </div>
        <div class="form-row">
          <label>Theme</label>
          <select id="theme">
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </div>
      </section>

      <div class="actions">
        <button id="saveBtn" class="btn primary">Save settings</button>
        <span id="saveResult" class="muted small"></span>
      </div>
    </main>
  </div>
  <script src="options.js"></script>
</body>
</html>
